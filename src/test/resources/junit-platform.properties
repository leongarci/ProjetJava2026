# JUnit Platform Configuration Properties
# https://junit.org/junit5/docs/current/user-guide/#configuration-parameters

# Afficher les résultats des tests détaillés
junit.jupiter.execution.parallel.enabled=false

# Reporter les classes de test
junit.platform.reporting.open.stream.stdout=true

# Timeout par défaut pour les tests
junit.jupiter.execution.timeout.default=30s

